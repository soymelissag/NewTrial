<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Peter Luger × Fuku — Sando Launch Party</title>
<meta name="description" content="Two New York icons, one night in Miami. The first bite of the new Peter Luger × Fuku sando — October 8, 7–10 PM, 135 Miracle Mile.">
<link rel="stylesheet" href="css/neue-montreal.css">
<link rel="stylesheet" href="css/invite.css">
</head>
<body>

<main class="poster">
  <div class="stage">

    <!-- ── Mascot: the martini that comes with it ─────────────────── -->
    <svg class="mascot" viewBox="0 0 300 360" aria-hidden="true">
      <g class="mascot__glass">
        <path d="M20 30 C 100 16, 200 16, 280 30 C 244 104, 194 152, 168 182
                 L 168 292 C 202 298, 226 310, 236 326 L 64 326
                 C 74 310, 98 298, 132 292 L 132 182
                 C 106 152, 56 104, 20 30 Z"></path>
        <path d="M188 8 L214 96 L196 100 L178 14 Z"></path>
      </g>
      <circle class="mascot__olive" cx="116" cy="88" r="34"></circle>
      <circle class="mascot__olive" cx="182" cy="70" r="27"></circle>
      <circle class="mascot__pit" cx="116" cy="88" r="13"></circle>
      <circle class="mascot__pit" cx="182" cy="70" r="10"></circle>
      <g class="mascot__spark">
        <path d="M262 150 L276 186 L262 222 L248 186 Z"></path>
        <path d="M40 214 L50 238 L40 262 L30 238 Z"></path>
      </g>
    </svg>

    <!-- ── The three big words ────────────────────────────────────── -->
    <h1 class="word word--sando">Sando</h1>
    <p class="word word--launch">Launch</p>
    <p class="word word--party">Party</p>

    <!-- ── Fuku staircase lockup ──────────────────────────────────── -->
    <div class="lockup" aria-label="Peter Luger × Fuku">
      <span class="lockup__pl">Peter Luger&nbsp;×</span>
      <span class="lockup__stack" aria-hidden="true">
        <b>F</b><b>U</b><b>K</b><b>U</b>
      </span>
    </div>

    <!-- ── Date badge ─────────────────────────────────────────────── -->
    <p class="badge">
      <span>October 8<sup>th</sup></span>
      <span>7–10 PM</span>
    </p>

    <!-- ── Tagline bar ────────────────────────────────────────────── -->
    <p class="tag">Two New York icons.<br>One night in Miami.</p>

    <!-- ── Friends line ───────────────────────────────────────────── -->
    <p class="friends">Martinis all night from our friend<br><b>Giovanny Gutierrez</b></p>

    <!-- ── Ruled detail column ────────────────────────────────────── -->
    <ul class="list">
      <li>First&nbsp;&nbsp;Bite</li>
      <li>Martinis</li>
      <li>Take-Homes</li>
      <li class="list__long">135&nbsp;Miracle&nbsp;Mile</li>
    </ul>

    <!-- ── Sign-off ───────────────────────────────────────────────── -->
    <p class="hungry">Come Hungry</p>

  </div>
</main>

</body>
</html>
